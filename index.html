<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b2430">
  <title>HF Selcall</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>

<body>
  <main>
    <h1>HF Selcall</h1>
    <p class="hint">CCIR 493-4 individual call</p>

    <form id="call-form" autocomplete="off">
      <button id="call" type="submit">Call</button>
      <p id="status" role="status" aria-live="polite"></p>

      <label>Destination ID
        <input id="to" name="to" inputmode="numeric" pattern="\d{4}|\d{6}" maxlength="6" required list="recent">
      </label>
      <datalist id="recent"></datalist>
      <div id="recent-buttons" class="chips"></div>

      <label>My ID
        <input id="from" name="from" inputmode="numeric" pattern="\d{4}|\d{6}" maxlength="6" required>
      </label>

      <fieldset class="segmented">
        <legend>Preamble</legend>
        <label><input type="radio" name="preamble" value="600" checked><span>6 s<small>scanning</small></span></label>
        <label><input type="radio" name="preamble" value="300"><span>3 s</span></label>
        <label><input type="radio" name="preamble" value="100"><span>1 s<small>on channel</small></span></label>
      </fieldset>
    </form>
  </main>
</body>

</html>
